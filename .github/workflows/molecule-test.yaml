name: Ansible Molecule Testing

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  molecule:
    name: "Molecule Test"
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] ansible-core
          # Добавляем путь к установленной молекуле в PATH текущей сессии
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Molecule Test
        working-directory: ./ansible
        run: |
          molecule test --all
