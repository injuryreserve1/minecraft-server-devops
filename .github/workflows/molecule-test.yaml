name: Ansible Molecule Testing

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  molecule:
    name: "Molecule Test"
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-cache-dependency-path: 'ansible/.venv'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] ansible-core

      - name: Run Molecule Test
        working-directory: ./ansible
        run: |
          molecule test --all
