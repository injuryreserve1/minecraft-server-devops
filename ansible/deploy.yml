---
- name: Install Docker and Terraform fast
  hosts: all
  become: true
  tasks:

    - name: Install Docker and unzip
      apt:
        update_cache: true
        name:
          - docker.io
          - unzip
        state: present

    - name: Download and шnstall Terraform from Yandex Mirror
      unarchive:
        src: https://mirror.yandex.ru/mirrors/releases.hashicorp.com/terraform/1.9.1/terraform_1.9.1_linux_amd64.zip
        dest: /usr/local/bin/
        remote_src: true
        mode: '0755'
