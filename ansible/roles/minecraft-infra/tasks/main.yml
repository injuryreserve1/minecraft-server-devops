---
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      # - terraform
    state: present
    update_cache: true

- name: Ensure docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create project folder
  ansible.builtin.file:
    path: "{{ minecraft_project_dir }}"
    state: directory
    mode: '0755'

- name: Download Prometheus exporter plugin
  ansible.builtin.get_url:
    url: "{{ prometheus_exporter_url }}"
    dest: "{{ minecraft_project_dir }}/minecraft-prometheus-exporter.jar"
    mode: '0644'

- name: Run terraform manifest
  community.general.terraform:
    project_path: "{{ minecraft_project_dir }}/terraform"
    state: present
  when: minecraft_run_terraform | bool