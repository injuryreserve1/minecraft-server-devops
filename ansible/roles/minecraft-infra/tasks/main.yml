---
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true

- name: Ensure docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create project folder for sources
  ansible.builtin.file:
    path: "{{ minecraft_project_dir }}"
    state: directory
    mode: '0755'

- name: Ensure docker volume directory exists
  ansible.builtin.file:
    path: "/var/lib/docker/volumes/mc_server_data/_data/plugins"
    state: directory
    mode: '0755'
  become: true

- name: Download Prometheus exporter plugin directly to volume
  ansible.builtin.get_url:
    url: "{{ prometheus_exporter_url }}"
    dest: "/var/lib/docker/volumes/mc_server_data/_data/plugins/minecraft-prometheus-exporter-3.1.2.jar"
    mode: '0644'
  become: true

- name: Create Prometheus config directory on host
  ansible.builtin.file:
    path: "{{ minecraft_project_dir }}/prometheus"
    state: directory
    mode: '0755'

- name: Prepare prometheus.yml config on host
  ansible.builtin.copy:
    dest: "{{ minecraft_project_dir }}/prometheus/prometheus.yml"
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: 'minecraft'
          static_configs:
            - targets: ['mc-devops-project:9940']
    mode: '0644'

- name: Run terraform manifest
  community.general.terraform:
    project_path: "{{ minecraft_project_dir }}/terraform"
    state: present
  become: true
  when: minecraft_run_terraform | bool
