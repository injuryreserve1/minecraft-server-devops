---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check docker installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      check_mode: true
      register: docker_svc
      failed_when: docker_svc.changed

    - name: Check project dir
      ansible.builtin.stat:
        path: /home/comp/terraform/minecraft_project
      register: proj
      failed_when: not proj.stat.isdir

    - name: Check exporter jar inside minecraft container
      ansible.builtin.command: docker exec mc-devops-project test -f /data/plugins/minecraft-prometheus-exporter-3.1.2.jar
      changed_when: false
