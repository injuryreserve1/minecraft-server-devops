---
- name: download docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: create folder for project
  ansible.builtin.file:
    path: "{{ minecraft_project_dir }}"
    state: directory
    mode: '0755'

- name: download plugin prometheus exporter
  ansible.builtin.get_url:
    url: "{{ minecraft_plugin_url }}"
    dest: "{{ minecraft_project_dir }}/minecraft-prometheus-exporter-{{ minecraft_plugin_version }}.jar"
    mode: '0644'
